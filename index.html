<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>火箭爐空氣流動模擬器</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>火箭爐空氣流動模擬器</h1>
        <p>設計 → 點火 → 觀察 → 修改 → 再測試</p>
      </div>
      <div class="notice">教學用簡化模型，不代表真實 CFD 結果</div>
    </header>

    <section class="workspace">
      <aside class="panel tools">
        <h2>1. 建造火箭爐</h2>
        <div class="tool-grid" role="group" aria-label="建造工具">
          <button class="tool active" data-tool="wall">磚塊／爐壁</button>
          <button class="tool" data-tool="inlet">進氣口</button>
          <button class="tool" data-tool="fire">火源</button>
          <button class="tool" data-tool="chimney">煙囪</button>
          <button class="tool" data-tool="erase">橡皮擦</button>
        </div>

        <h2>2. 測試</h2>
        <div class="action-stack">
          <button id="igniteBtn" class="primary">🔥 點火</button>
          <button id="pauseBtn">暫停</button>
          <button id="clearBtn">全部清除</button>
        </div>

        <label class="range-label" for="particleCount">空氣粒子數</label>
        <input id="particleCount" type="range" min="80" max="500" step="20" value="240" />

        <div class="legend">
          <span><i class="dot air"></i> 空氣</span>
          <span><i class="dot heat"></i> 受熱空氣</span>
          <span><i class="box wall"></i> 爐壁</span>
        </div>
      </aside>

      <section class="simulation-card">
        <canvas id="simCanvas" width="900" height="560" aria-label="火箭爐氣流模擬畫布"></canvas>
        <p class="hint">在畫布上點擊或拖曳放置爐壁。進氣口、火源與煙囪用點擊放置。</p>
      </section>

      <aside class="panel metrics">
        <h2>3. 觀察結果</h2>
        <div class="metric-card">
          <span>氣流順暢度</span>
          <strong id="flowScore">—</strong>
        </div>
        <div class="metric-card">
          <span>平均氣流速度</span>
          <strong id="avgSpeed">—</strong>
        </div>
        <div class="metric-card">
          <span>停滯粒子比例</span>
          <strong id="stagnantRate">—</strong>
        </div>
        <div id="feedback" class="feedback">周圍已充滿空氣。先設計火箭爐，再按「點火」。</div>
      </aside>
    </section>

    <section class="teacher-note">
      <h2>學生觀察重點</h2>
      <ul>
        <li>點火後，原本周圍的空氣是否開始被帶動？</li>
        <li>哪些轉角或狹窄處讓粒子變慢或卡住？</li>
        <li>改變進氣口與煙囪位置後，流動是否變順？</li>
      </ul>
    </section>
  </main>
  <script src="js/app.js?v=20260825-5"></script>
</body>
</html>
